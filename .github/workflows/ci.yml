name: CI

# Phase 4.4 (Warning W11, W12).
#
# This file replaces both `ci.yml` and `verify.yml`, which were ~95% duplicates —
# every push spun up TWO MySQL containers, ran `npm ci` twice and `next build`
# twice.
#
# Fixes applied:
#  - `test:unit` / `test:security` were referenced by CI but did not exist in
#    package.json, so the pipeline was permanently red. There are still no test
#    files in the repo, so those steps are gone rather than faked.
#  - added `permissions: contents: read` (default GITHUB_TOKEN scopes are
#    read-write on older org settings)
#  - added `concurrency` to cancel superseded runs
#  - added an `npm audit --omit=dev --audit-level=high` gate, so the critical
#    Next.js RCE (GHSA-2xp9-vwfh-vxw4, CVSS 9.0) that was sitting in the tree
#    cannot merge again
#  - actions pinned to commit SHAs instead of mutable @v4 tags

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default.
permissions:
  contents: read

jobs:
  ci:
    name: Typecheck / Lint / Audit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtruong_store_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      # Ephemeral CI container only — never the production database.
      # Supabase migration: provider is now postgresql everywhere (local, CI, prod).
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/mtruong_store_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/mtruong_store_test?schema=public"
      JWT_ACCESS_SECRET: "ci-access-secret-that-is-at-least-32-characters"
      JWT_REFRESH_SECRET: "ci-refresh-secret-that-is-at-least-32-characters"
      REFRESH_TOKEN_TTL: "604800"
      NEXT_PUBLIC_APP_URL: "https://example.com"
      STORAGE_PROVIDER: "cloudinary"
      CLOUDINARY_CLOUD_NAME: "ci_dummy"
      CLOUDINARY_API_KEY: "1234567890"
      CLOUDINARY_API_SECRET: "ci_dummy_secret"
      NOTIFICATION_PROVIDER: "webhook"
      NOTIFICATION_EMAIL_WEBHOOK_URL: "https://notify.example.com/email"
      NOTIFICATION_ALLOWED_HOSTS: "notify.example.com"
      # Phase 2.5: declared here so the schema check in src/config/env.ts is
      # exercised on every build, not just in production.
      WEBHOOK_SECRET: "ci-webhook-secret-that-is-at-least-32-chars"

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.3
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # OP2: prove the production env schema passes in CI with production-like
      # values, so a missing/invalid prod variable fails here — not at 2am on
      # the deploy. NODE_ENV=production activates every superRefine gate
      # (CRON_SECRET, TRUST_PROXY, WEBHOOK_SECRET, ...).
      - name: Preflight (production env schema)
        run: npm run preflight
        env:
          NODE_ENV: "production"
          CRON_SECRET: "ci-cron-secret-that-is-at-least-32-chars"
          TRUST_PROXY: "true"

      # Phase 4.4: secret scanning. The repo previously had none, which is how a
      # SQL dump containing password hashes, bank details and session tokens was
      # committed and pushed to origin/main.
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@cb7149a2b00619988e4f19e2d7d07376bfa4d0df # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Requires the repo to be public or an org license; harmless otherwise.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Migrations to CI MySQL
        run: npx prisma migrate deploy

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Money Static Audit
        run: npm run money:static

      - name: Run Order State Audit
        run: npm run order-state:audit

      # Phase 1.1: `build` no longer contains `prisma db push --accept-data-loss`,
      # so running it here can never mutate a real database.
      - name: Run Production Build
        run: npm run build